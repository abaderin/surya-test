services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surya}
      POSTGRES_USER: ${POSTGRES_USER:-surya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surya}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surya} -d ${POSTGRES_DB:-surya}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "6379:6379"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: surya-test-app:latest
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://razer.home.baderin.me:5173
    volumes:
      - storage:/app/storage

  backend:
    image: surya-test-app:latest
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://razer.home.baderin.me:5173
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: surya-test-app:latest
    command: ["uv", "run", "python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://razer.home.baderin.me:5173
    volumes:
      - storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
  storage:
