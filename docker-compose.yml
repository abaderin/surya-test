services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surya}
      POSTGRES_USER: ${POSTGRES_USER:-surya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surya}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surya} -d ${POSTGRES_DB:-surya}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: surya-test-app:latest
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      PYTHONPATH: /app
      CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080,http://razer.home.baderin.me:18080
    volumes:
      - storage:/app/storage

  backend:
    image: surya-test-app:latest
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080,http://razer.home.baderin.me:18080
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: surya-test-app:latest
    command: ["python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "false"
      WORKER_TASK_TYPES: validation,render_page,image_extraction,meta_extraction
      CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080,http://razer.home.baderin.me:18080
    volumes:
      - storage:/app/storage

  layout-worker:
    image: surya-test-app:latest
    command: ["python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "false"
      WORKER_TASK_TYPES: layout
      CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080,http://razer.home.baderin.me:18080
    volumes:
      - storage:/app/storage
    gpus: all
    group_add:
    - video

  ocr-worker:
    image: surya-test-app:latest
    command: ["python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://surya:surya@db:5432/surya
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "false"
      WORKER_TASK_TYPES: ocr
      CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080,http://razer.home.baderin.me:18080
    volumes:
      - storage:/app/storage
    gpus: all
    group_add:
    - video

  jupyter:
    build:
      context: .
      dockerfile: jupyter/Dockerfile
    image: surya-test-jupyter:latest
    ports:
      - "18888:18888"
    volumes:
      - ./jupyter:/home/jupyter
    gpus: all

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy

  router:
    image: nginx:alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "18080:80"
    volumes:
      - ./docker/router/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  storage:
